<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Served before any JS runs, so a crawler and a booting tab both have a name -->
		<title>Glass Garden</title>
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<!-- Fallback for the handful of browsers that will not take an SVG icon -->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<!-- iOS home screen; it applies its own rounding, so this one is full-bleed -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Tracks the system scheme rather than the in-app toggle, which is close enough -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbfd" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116" />
		<meta property="og:site_name" content="Glass Garden" />
		<meta property="og:title" content="Glass Garden" />
		<meta
			property="og:description"
			content="Drag-and-drop cloud architecture that actually runs, entirely in your browser"
		/>
		<!-- Link previews need an absolute URL, and only the deployment knows its own address -->
		<meta property="og:image" content="%sveltekit.env.PUBLIC_ORIGIN%/og.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<!-- Covers the bundle download, delayed so a quick load never flashes it -->
		<style>
			#boot-spinner {
				position: fixed;
				inset: 0;
				margin: auto;
				width: 2rem;
				height: 2rem;
				color: var(--muted-foreground);
				opacity: 0;
				animation:
					boot-spin 1s linear infinite,
					boot-appear 0.2s 0.8s forwards;
			}
			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@keyframes boot-appear {
				to {
					opacity: 1;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<svg
			id="boot-spinner"
			role="status"
			aria-label="Loading"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
		>
			<path d="M21 12a9 9 0 1 1-6.219-8.56" />
		</svg>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
