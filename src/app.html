<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<!-- Fallback for the handful of browsers that will not take an SVG icon -->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<!-- iOS home screen; it applies its own rounding, so this one is full-bleed -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Tracks the system scheme rather than the in-app toggle, which is close enough -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbfd" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
