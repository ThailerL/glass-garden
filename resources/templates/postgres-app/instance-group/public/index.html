<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page views</title>
    <!-- Inline rather than a stylesheet of its own, so a page load is one request. The balancer
         picks a target per request, so a page that fetched a second file would have its two
         requests land on two different instances, and the port shown would be true of only half
         of what is on screen -->
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        font: 16px/1.5 serif;
      }

      main {
        width: min(32rem, 100% - 3rem);
      }

      .total {
        margin: 0;
        font-size: 4rem;
        font-weight: 600;
        line-height: 1;
      }

      .caption {
        margin: 0.5rem 0 0;
        opacity: 0.7;
        font-size: 0.875rem;
      }

      .instances {
        margin: 2rem 0;
        padding: 0;
        list-style: none;
      }

      .instances li {
        display: grid;
        grid-template-columns: 4rem 1fr 3rem;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0;
        border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent);
        font-variant-numeric: tabular-nums;
      }

      /* The instance that answered this particular request */
      .instances .serving {
        font-weight: 600;
      }

      .bar {
        height: 0.5rem;
        border-radius: 0.25rem;
        background: color-mix(in srgb, currentColor 25%, transparent);
      }

      .serving .bar {
        background: currentColor;
      }

      .count {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="total">{{total}}</p>
      <p class="caption">page views, counted in the database every instance shares</p>

      <ul class="instances">
        {{bars}}
      </ul>

      <p class="caption">
        This request was served by the instance on <strong>:{{port}}</strong>. Refresh and another
        instance may pick it up, but the total keeps climbing, because the count lives in
        Postgres rather than in any one instance.
      </p>
    </main>
  </body>
</html>
